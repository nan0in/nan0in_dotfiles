# : Manager [[[

[mgr]
cwd = { fg = "{{colors.on_surface.default.hex}}" }

# Find
find_keyword  = { fg = "{{colors.error.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.error.default.hex}}", bold = true, italic = true }

# Marker
marker_copied   = { fg = "{{colors.tertiary_fixed.default.hex | auto_lightness: 20.0}}", bg = "{{colors.tertiary_fixed.default.hex | auto_lightness: 20.0}}" }
marker_cut      = { fg = "{{colors.tertiary_fixed.default.hex}}", bg = "{{colors.tertiary_fixed.default.hex}}" }
marker_marked   = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

# Count
count_copied   = { fg = "{{colors.on_tertiary_fixed.default.hex}}", bg = "{{colors.tertiary_fixed.default.hex}}" }
count_cut      = { fg = "{{colors.on_tertiary_fixed.default.hex}}", bg = "{{colors.tertiary_fixed.default.hex}}" }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{colors.surface_tint.default.hex}}" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "{{colors.primary.default.hex}}", bold = true, bg = "{{colors.surface.default.hex}}" }
inactive  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface.default.hex}}" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", bold = true }
normal_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }

# Select mode
select_main = { bg = "{{colors.secondary.default.hex}}", fg = "{{colors.on_secondary.default.hex}}", bold = true }
select_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }

# Unset mode
unset_main = { bg = "{{colors.tertiary.default.hex}}", fg = "{{colors.on_tertiary.default.hex}}", bold = true }
unset_alt  = { bg = "{{colors.surface_variant.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "{{colors.secondary.default.hex | auto_lightness: 30.0}}" }
perm_write = { fg = "{{colors.tertiary.default.hex | auto_lightness: 30.0}}" }
perm_read  = { fg = "{{colors.error.default.hex | auto_lightness: 30.0}}" }
perm_exec  = { fg = "{{colors.tertiary_fixed.default.hex | auto_lightness: 30.0}}" }
perm_sep   = { fg = "{{colors.primary_fixed.default.hex | auto_lightness: 30.0}}" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_bright.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_bright.default.hex}}" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "{{colors.surface_bright.default.hex}}" }
cand = { fg = "{{colors.primary.default.hex}}" }
rest = { fg = "{{colors.on_primary.default.hex}}" }
desc = { fg = "{{colors.on_surface.default.hex}}" }
separator = " ▶ "
separator_style = { fg = "{{colors.on_surface.default.hex}}" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "{{colors.tertiary.default.hex}}" }
title_warn  = { fg = "{{colors.primary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "{{colors.primary.default.hex}}" }
value  = { fg = "{{colors.on_surface.default.hex}}" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.on_primary.default.hex}}" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = {}
hovered = { fg = "{{colors.tertiary_fixed.default.hex}}", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "{{colors.on_surface.default.hex}}" }
run    = { fg = "{{colors.on_surface.default.hex}}" }
footer = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # 特殊状态（优先匹配）
    { url = "*", is = "orphan", fg = "{{colors.on_error_container.default.hex}}", bg = "{{colors.error_container.default.hex}}" },
    { url = "*", is = "link", fg = "{{colors.on_surface_variant.default.hex}}" },
    { url = "*", is = "exec", fg = "{{colors.tertiary_fixed.default.hex | auto_lightness: 20.0}}" },

    # 目录
    { url = "*/", fg = "{{colors.primary.default.hex}}" },

    # 无扩展名的构建/工具文件
    { url = "*{Makefile,GNUmakefile,CMakeLists.txt,Justfile,Dockerfile,Containerfile,Procfile,Vagrantfile,Jenkinsfile,PKGBUILD,Gemfile,Rakefile,Brewfile,node_modules,build,workspace}", fg = "{{colors.primary.default.hex | auto_lightness: 10.0}}" },

    # 敏感文件 / Git 元数据
    { url = "*.env*", fg = "{{colors.error.default.hex | auto_lightness: 10.0}}" },
    { url = "*.git*", fg = "{{colors.error.default.hex | auto_lightness: 5.0}}" },

    # 源代码 / 脚本 / 构建
    { url = "*.{R,ada,adb,ads,android,apl,applescript,asm,awk,azcli,bash,bat,bazel,bicep,bicepparam,bqn,bzl,c,c++,cbl,cc,ccm,clj,cljc,cljd,cljs,cmake,cob,cobol,coffee,cp,cpp,cppm,cpy,cr,cs,csh,csproj,cu,cuh,cxx,cxxm,d,d.ts,dart,diff,dockerfile,drl,ebuild,edn,eex,el,elc,elm,eln,epp,erl,ex,exs,f#,f90,feature,fish,fnl,frag,fs,fsi,fsscript,fsx,gd,gemspec,geom,gleam,glsl,gnumakefile,go,godot,gpr,gradle,gradlew,groovy,h,heex,hh,hpp,hrl,hs,huff,hx,hxx,ino,ipynb,ixx,java,jl,ksh,kt,kts,leex,lhs,lua,luac,luau,m,makefile,mint,mk,ml,mli,mm,mojo,nim,nix,nu,odin,patch,pl,pm,pro,ps1,psd1,psm1,pxd,pxi,py,pyc,pyd,pyi,pyo,pyw,pyx,r,rake,rb,res,resi,rproj,rs,s,sbt,sc,scad,scala,scm,sh,sln,slnx,sml,sol,sv,svh,swift,t,tbc,tcl,terminal,tf,tfvars,tmpl,v,vala,vert,vh,vhd,vhdl,vsh,x,xcplayground,xm,zig,zon,zsh}", fg = "{{colors.primary.default.hex | auto_lightness: 10.0}}" },

    # Web / 前端 / 标记
    { url = "*.{astro,blade.php,cfc,cfm,cjs,cshtml,css,cts,ejs,erb,gql,graphql,haml,hbs,htm,html,http,hurl,js,jsx,less,liquid,mjs,mts,mustache,php,qml,qrc,qss,razor,sass,scss,slim,spec.js,spec.jsx,spec.ts,spec.tsx,stories.js,stories.jsx,stories.mjs,stories.svelte,stories.ts,stories.tsx,stories.vue,styl,svelte,templ,test.js,test.jsx,test.ts,test.tsx,ts,tsx,twig,vue,webpack,xaml,xul}", fg = "{{colors.primary_fixed.default.hex | auto_lightness: 10.0}}" },

    # 配置 / 数据 / 数据库
    { url = "*.{asc,cfg,conda,conf,config.ru,cow,cson,csv,cue,db,dconf,desktop,dockerignore,dot,dropbox,dump,gitignore,gresource,gv,ical,icalendar,ics,ifb,ini,json,json5,jsonc,jwmrc,lock,magnet,md5,mo,msf,nswag,po,pot,prisma,properties,pub,qm,query,rasi,rss,sha1,sha224,sha256,sha384,sha512,sig,signature,sql,sqlite,sqlite3,sublime,theme,tmux,toml,tres,tscn,tsconfig,typoscript,ui,vi,vim,webmanifest,xcstrings,xml,xslt,yaml,yml}", fg = "{{colors.secondary.default.hex}}" },

    # 文档 / 办公 / 电子书
    { url = "*.{ass,bib,doc,docx,ebook,epub,fodp,fods,fodt,info,markdown,md,mdx,mobi,nfo,norg,odf,odp,ods,odt,org,pdf,pp,ppt,pptx,rmd,rtf,srt,ssa,sub,tex,txt,typ,xls,xlsx}", fg = "{{colors.on_surface.default.hex}}" },

    # 图片 / 设计 / 3D / CAD
    { url = "*.{3mf,ai,avif,blend,blp,bmp,brep,dwg,dxf,f3d,fbx,fcbak,fcmacro,fcmat,fcparam,fcscript,fcstd,fcstd1,fctb,fctl,fodg,gcode,gif,glb,ico,ifc,ige,iges,igs,image,jpeg,jpg,jxl,kicad_dru,kicad_mod,kicad_pcb,kicad_prl,kicad_pro,kicad_sch,kicad_sym,kicad_wks,kpp,kra,krz,material,obj,odg,ply,png,psb,psd,skp,sldasm,sldprt,slvs,ste,step,stl,stp,svg,svgz,webp,wrl,wrz,xcf}", fg = "{{colors.tertiary_fixed.default.hex}}" },

    # 音频
    { url = "*.{aac,aif,aiff,ape,flac,lrc,m3u,m3u8,m4a,mp3,oga,ogg,opus,pcm,pls,spx,wav,wma,wv,wvc}", fg = "{{colors.tertiary.default.hex}}" },

    # 视频
    { url = "*.{3gp,cast,kdenlive,kdenlivetitle,m4v,mkv,mov,mp4,ogv,ogx,webm,wmv}", fg = "{{colors.error.default.hex}}" },

    # 压缩包 / 镜像 / 安装包
    { url = "*.{7z,apk,bz,bz2,bz3,gz,img,iso,jar,pck,rar,tgz,torrent,txz,vsix,xpi,xz,zip,zst}", fg = "{{colors.secondary_fixed.default.hex | auto_lightness: 10.0}}" },

    # 字体
    { url = "*.{eot,flc,flf,lff,otf,ttf,woff,woff2}", fg = "{{colors.primary_fixed.default.hex | auto_lightness: 5.0}}" },

    # 二进制 / 可执行 / 库
    { url = "*.{a,app,bin,dll,elf,exe,hex,ko,lib,o,out,rlib,so,strings,suo,wasm}", fg = "{{colors.tertiary_fixed.default.hex | auto_lightness: 20.0}}" },

    # 临时 / 日志 / 缓存
    { url = "*.{bak,cache,crdownload,download,fdmdownload,lck,log,part}", fg = "{{colors.outline.default.hex}}" },

    # 其他带扩展名 / 隐藏文件
    { url = "*.*", fg = "{{colors.secondary.default.hex}}" },

    # 兜底
    { url = "*", fg = "{{colors.on_surface.default.hex}}" },
]

# : ]]]

