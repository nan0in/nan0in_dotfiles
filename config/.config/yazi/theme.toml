# Yazi will use its built-in dark/light preset.
# Only add overrides here — do NOT provide a full theme
# unless you want to replace the preset entirely.

[preview]
ueberzug = "none"
image = "chafa -f symbols --size 60x30"
video = "ffmpegthumbnailer -i \"$1\" -o - | chafa"

[filetype]
rules = [
	{ mime = "image/*", fg = "#ff79c6", bold = true },
	{ mime = "{audio,video}/*", fg = "#bd93f9", italic = true },
]
