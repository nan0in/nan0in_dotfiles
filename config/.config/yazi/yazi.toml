
[mgr]
ratio          = [1, 3, 4]    # 父目录:当前目录:预览 比例
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    =  false# 建议开启：作为开发者通常需要看 .config 等隐藏文件
show_symlink   = true
scrolloff      = 5
# 原生拖放：在 kitty 中拖出文件，或接收其他窗口拖入的文件。
mouse_events   = ["click", "scroll", "touch", "drag"]
title_format   = "Yazi: {cwd}"

[preview]
tab_size        = 2
max_width       = 1000        # 调大：适应高分屏
max_height      = 1500        # 调大
cache_dir       = ""
image_filter    = "lanczos3"  # 优化：比 triangle 质量更好，虽然稍微慢一点点
image_quality   = 90          # 提高预览图质量
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# --- 1. 编辑器 ---
edit = [
	# 优先使用 Neovim，如果没有则回退到 vi
	{ run = '${EDITOR:-nvim} %s', desc = "Neovim", block = true, for = "unix" },
]

# --- 2. 系统默认打开 ---
open = [
	{ run = 'xdg-open %s1', desc = "Open", for = "linux" },
]

# --- 3. 视频播放器 (VLC) ---
# block=false: 不阻塞 yazi 界面
# orphan=true: 即使 yazi 关闭，视频播放器依然保留
play_video = [
	{ run = 'vlc %s', block = false, orphan = true, desc = "VLC" },
]

# --- 4. 解压工具 ---
# 默认解压命令，稍后我们会用插件增强预览
extract = [
	{ run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
]

# --- 5. 终端内查看 ---
reveal = [
	{ run = 'xdg-open %d1', desc = "Reveal", for = "linux" },
	{ run = '''exiftool %s1; echo "按 Enter 退出"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]

chrome = [
    { run = 'google-chrome-stable %s', desc = "Google Chrome", orphan = true, for = "linux" },
]


# WPS Writer
wps = [
    { run = 'wps %s', desc = "WPS Writer", orphan = true, for = "linux" },
]

# WPS Spreadsheets
et = [
    { run = 'et %s', desc = "WPS Spreadsheets", orphan = true, for = "linux" },
]

# WPS Presentation
wpp = [
    { run = 'wpp %s', desc = "WPS Presentation", orphan = true, for = "linux" },
]


[open]
prepend_rules = [
	# 1. 视频：使用 MIME 类型匹配所有视频，通过 VLC 打开
	{ mime = "video/*", use = "play_video" },
    
  { mime = "application/pdf", use = "chrome" },
      # Word
  { mime = "application/msword", use = ["wps", "open"] },
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = ["wps", "open"] },

  # Excel
  { mime = "application/vnd.ms-excel", use = ["et", "open"] },
  { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = ["et", "open"] },

  # PowerPoint
  { mime = "application/vnd.ms-powerpoint", use = ["wpp", "open"] },
  { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = ["wpp", "open"] },

]

# 默认规则 (保留原样作为后备)
rules = [
	{ mime = "inode/directory", use = ["edit", "open", "reveal"] },
	{ mime = "text/*", use = ["edit", "reveal"] },
	{ mime = "image/*", use = ["open", "reveal"] },
	{ mime = "{audio,video}/*", use = ["play", "reveal"] },
	{ mime = "application/{,g}zip", use = ["extract", "reveal"] },
	{ mime = "application/{tar,bzip*,7z*,xz,rar}", use = ["extract", "reveal"] },
	{ mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
	{ mime = "*/javascript", use = ["edit", "reveal"] },
	{ mime = "inode/empty", use = ["edit", "reveal"] },
	{ mime = "", use = ["edit", "reveal"] },
	# catch-all: yazi provides built-in fallback, no explicit rule needed
]

[plugin]
# 这里配置插件行为

preloaders = [
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "application/pdf", run = "pdf" },
]

previewers = [
	{ mime = "inode/directory", run = "folder", sync = true },
    
    # --- ouch 预览配置 ---
    # 匹配常见压缩格式
    { mime = "application/*zip", run = "ouch" },
    { mime = "application/x-tar", run = "ouch" },
    { mime = "application/x-bzip2", run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar", run = "ouch" },
    { mime = "application/x-xz", run = "ouch" },
    
	{ mime = "text/*", run = "code" },
	{ mime = "*/{xml,javascript,x-wine-extension-ini}", run = "code" },
	{ mime = "application/{json,x-ndjson}", run = "json" },
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "application/pdf", run = "pdf" },
	
    # 原生归档预览作为 fallback
    { mime = "application/{,g}zip", run = "archive" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar,iso9660-image}", run = "archive" },
    
	# catch-all: yazi provides built-in fallback, no explicit rule needed
]
